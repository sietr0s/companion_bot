[pytest]
testpaths = tests
asyncio_mode = auto
addopts = --ignore=tests/modules/media --ignore=tests/modules/notifications --ignore=tests/test_storage.py
markers =
    e2e: E2E тесты с реальным Telegram API
    slow: Медленные тесты (запускать отдельно)
    telegram: Тесты с Telegram API
    bot: Тесты с ботом
