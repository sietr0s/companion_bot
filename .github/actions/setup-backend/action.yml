name: Set up backend
description: Install the tested Python/CPU dependencies using shared CI constraints
inputs:
  quality-tools:
    description: Also install the static analysis and dependency audit tools
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-lint.txt
          requirements-quality.txt
          requirements-ci-constraints.txt
    - name: Update packaging tools
      shell: bash
      run: python -m pip install --upgrade pip setuptools -c requirements-ci-constraints.txt
    - name: Install CPU PyTorch
      shell: bash
      run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch -c requirements-ci-constraints.txt
    - name: Install test dependencies
      shell: bash
      run: python -m pip install -r requirements-dev.txt -c requirements-ci-constraints.txt
    - name: Install analysis tools
      if: inputs.quality-tools == 'true'
      shell: bash
      run: python -m pip install -r requirements-quality.txt -c requirements-ci-constraints.txt
    - name: Check dependencies
      shell: bash
      run: python -m pip check
