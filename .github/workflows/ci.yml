name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - run: python -m pip install -r requirements-lint.txt
      - name: Lint Python
        run: ruff check src tests scripts --output-format github
      - name: Check Python formatting
        run: ruff format --check src tests scripts

  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable test-only values; these are not deployment credentials.
      JWT_SECRET_KEY: ci-test-only-key-with-at-least-32-characters
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-test-only-password
      MESSAGE_BUS: in_memory
      LLM_PROVIDER: stub
      STT_PROVIDER: stub
      TTS_PROVIDER: stub
      HF_HUB_OFFLINE: '1'
      HYPOTHESIS_PROFILE: ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend
      - name: Run unit and integration tests
        run: >-
          python -m pytest tests
          --junitxml=reports/backend-tests.xml
          --cov=src --cov-branch
          --cov-report=term-missing
          --cov-report=json:reports/coverage/backend/coverage.json
          --cov-report=xml:reports/coverage/backend/coverage.xml
          --cov-report=html:reports/coverage/backend/html
      - name: Check backend coverage floors
        if: always()
        run: python scripts/coverage_gate.py backend reports/coverage/backend/coverage.json
      - name: Upload tests and browsable coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-and-coverage
          path: reports/
          retention-days: 30
          if-no-files-found: error

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        # Keep the lockfile's peer resolution consistent across local and CI installs.
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Lint TypeScript and React
        run: npm run lint
      - name: Test React and utilities with coverage
        run: npm run test:coverage
      - name: Check frontend coverage floors
        if: always()
        run: python ../scripts/coverage_gate.py frontend coverage/coverage-summary.json
      - name: Generate API client, typecheck and build
        run: npm run build
      - name: Upload frontend tests and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-tests-and-coverage
          path: |
            frontend/coverage/
            frontend/reports/
          retention-days: 30
          if-no-files-found: error
