services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companion_bot_app
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_change_me}
      DB_NAME: ${POSTGRES_DB:-modular_monolith}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MESSAGE_BUS: ${MESSAGE_BUS:-in_memory}
      APP_TITLE: ${APP_TITLE:-Companion Bot}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CREATE_TABLES_ON_STARTUP: ${CREATE_TABLES_ON_STARTUP:-True}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-modular-monolith}
      TG_API_ID: ${TG_API_ID:-0}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_SESSION_DIR: /app/sessions
      TEMPLATES_DIR: /app/templates
      MEDIA_STORAGE_PATH: /app/uploads
      MODEL_CACHE_DIR: /app/models
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-companion_bot}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
    volumes:
      - ./sessions:/app/sessions
      - ./templates:/app/templates:ro
      - ./models:/app/models
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - companion_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: companion_bot_frontend
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - companion_network
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg15
    container_name: companion_bot_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-modular_monolith}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - companion_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: companion_bot_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - companion_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - kafka
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: companion_bot_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
    networks:
      - companion_network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - kafka
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: companion_bot_redpanda_console
    ports:
      - "9000:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    networks:
      - companion_network
    profiles:
      - kafka
    depends_on:
      - kafka

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: companion_bot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5151}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - companion_network
    profiles:
      - admin
    restart: unless-stopped

networks:
  companion_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  uploads_data:
    driver: local
