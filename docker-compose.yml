version: '3.8'

services:
  # Основное приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms_starter_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/modular_monolith
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - MESSAGE_BUS=${MESSAGE_BUS:-in_memory}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-modular-monolith}
      - APP_TITLE=${APP_TITLE:-Modular Monolith}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TG_API_ID=${TG_API_ID:-}
      - TG_API_HASH=${TG_API_HASH:-}
      - TG_SESSION_DIR=/app/sessions
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-True}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@example.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-App}
      - TEMPLATES_DIR=/app/templates
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password_change_me}
      - DB_NAME=modular_monolith
    volumes:
      - ./sessions:/app/sessions
      - ./templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    networks:
      - ms_network
    restart: unless-stopped

  # Frontend Admin Panel
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ms_starter_frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - ms_network
    restart: unless-stopped

  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    container_name: ms_starter_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password_change_me}
      - POSTGRES_DB=modular_monolith
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт БД не экспортируется в production для безопасности
    # Для отладки используйте pgadmin профиль или подключайтесь через Docker network
    networks:
      - ms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modular_monolith"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Kafka (опционально, только с профилем kafka)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ms_starter_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ms_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - kafka
    restart: unless-stopped

  # Zookeeper (опционально, только с профилем kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ms_starter_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
    ports:
      - "2181:2181"
      - "8080:8080"
    networks:
      - ms_network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - kafka
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: ms_starter_redpanda_console
    ports:
      - "9000:8080"
    environment:
      - KAFKA_BROKERS=kafka:29092
    networks:
      - ms_network
    profiles:
      - kafka
    depends_on:
      - kafka

  # pgAdmin (опционально, только с профилieм admin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ms_starter_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ms_network
    profiles:
      - admin
    restart: unless-stopped

networks:
  ms_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

